<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/mission-docs-design-system-7384423c-d52c-4f5b-aea6-df1bdbd9d593/styles.css">
  <script src="_ds/mission-docs-design-system-7384423c-d52c-4f5b-aea6-df1bdbd9d593/_ds_bundle.js"></script>
</helmet>
<figure style="margin:0 0 32px;border:1px solid var(--border-card);background:var(--paper-000)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 10px 6px 14px;background:var(--paper-200);border-bottom:1px solid var(--border-card)">
    <div style="display:flex;gap:14px;align-items:baseline">
      <span style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--terra-600)">{{ fig }}</span>
      <span style="font-size:12px;color:var(--text-muted)">{{ title }}</span>
      <span style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-muted)">STEP {{ stepLabel }}</span>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <x-import component-from-global-scope="MissionDocsDesignSystem_738442.Button" variant="secondary" size="sm" onClick="{{ prev }}" hint-size="32px,28px">‹</x-import>
      <x-import component-from-global-scope="MissionDocsDesignSystem_738442.Button" variant="secondary" size="sm" onClick="{{ next }}" hint-size="32px,28px">›</x-import>
      <x-import component-from-global-scope="MissionDocsDesignSystem_738442.Button" variant="primary" size="sm" onClick="{{ play }}" hint-size="60px,28px">{{ playLabel }}</x-import>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)">
    <div style="padding:10px 0;font-family:var(--font-mono);font-size:12.5px;line-height:1.65;border-right:1px solid var(--border-card);overflow-x:auto">
      <sc-for list="{{ lines }}" as="l" hint-placeholder-count="6">
        <div style="display:grid;grid-template-columns:18px 30px 1fr;background:{{ l.bg }};transition:background 180ms">
          <span style="color:var(--terra-600);text-align:center;font-size:10px;line-height:20.6px">{{ l.marker }}</span>
          <span style="text-align:right;padding-right:10px;color:{{ l.numColor }};font-size:11px;line-height:20.6px;user-select:none">{{ l.num }}</span>
          <span style="white-space:pre;padding-right:14px;color:{{ l.fg }}">{{ l.t }}</span>
        </div>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-rows:auto 1fr;min-height:0">
      <div style="padding:12px 16px 10px;border-bottom:1px solid var(--rule-hairline)">
        <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px">variables</div>
        <sc-if value="{{ hasVars }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-family:var(--font-mono);font-size:12px">
            <sc-for list="{{ vars }}" as="v" hint-placeholder-count="2">
              <span style="color:var(--navy-800)">{{ v.k }}</span>
              <span style="color:{{ v.color }};white-space:pre-wrap;word-break:break-word">{{ v.v }}</span>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ noVars }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:var(--text-faint)">— none yet</div></sc-if>
      </div>
      <div style="padding:12px 16px 14px;background:var(--navy-900);color:var(--paper-100);font-family:var(--font-mono);font-size:12px;line-height:1.6;min-height:120px">
        <div style="font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--navy-300);margin-bottom:6px">terminal</div>
        <sc-for list="{{ io }}" as="o" hint-placeholder-count="0"><div style="white-space:pre-wrap;color:{{ o.color }}">{{ o.text }}</div></sc-for>
      </div>
    </div>
  </div>
  <div style="border-top:1px solid var(--border-card);padding:10px 16px 12px;font-size:13px;line-height:1.55;color:var(--text-body);min-height:44px;background:var(--paper-100)">{{ note }}</div>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:520},&quot;spec&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{fig:string,title:string,intro?:string,lines:string[],steps:{line:number,vars:Record&lt;string,any&gt;,io?:{k:'out'|'in'|'llm'|'sys',text:string}[],note:string}[]}&quot;}}">
class Component extends DCLogic {
  state = { step: -1, playing: false };
  componentWillUnmount() { clearInterval(this.t); }
  spec() { return this.props.spec || { lines: [], steps: [] }; }
  pause = () => { clearInterval(this.t); this.setState({ playing: false }); };
  play = () => {
    if (this.state.playing) return this.pause();
    const n = this.spec().steps.length;
    if (this.state.step >= n - 1) this.setState({ step: -1 });
    this.setState({ playing: true });
    this.t = setInterval(() => this.setState(s => {
      if (s.step + 1 >= n) { clearInterval(this.t); return { playing: false }; }
      return { step: s.step + 1 };
    }), 1700);
  };
  next = () => { this.pause(); this.setState(s => ({ step: Math.min(s.step + 1, this.spec().steps.length - 1) })); };
  prev = () => { this.pause(); this.setState(s => ({ step: Math.max(s.step - 1, -1) })); };
  renderVals() {
    const spec = this.spec(), step = this.state.step;
    const cur = step >= 0 ? spec.steps[step] : null;
    const lines = spec.lines.map((t, i) => {
      const hi = cur && cur.line === i + 1;
      return { t, num: (i + 1 + '').padStart(2, '0'), marker: hi ? '▶' : '', bg: hi ? 'var(--surface-brand-soft)' : 'transparent', numColor: hi ? 'var(--navy-700)' : 'var(--ink-300)', fg: hi ? 'var(--navy-900)' : 'var(--ink-700)' };
    });
    const vars = cur ? Object.entries(cur.vars || {}).map(([k, v]) => ({ k, v: v === null ? 'None' : typeof v === 'string' ? JSON.stringify(v) : String(v), color: typeof v === 'string' ? 'var(--terra-700)' : 'var(--ink-800)' })) : [];
    const COL = { out: 'var(--paper-100)', in: 'var(--terra-400)', llm: 'var(--navy-200)', sys: 'var(--slate-300)' };
    const io = spec.steps.slice(0, step + 1).flatMap(s => (s.io || []).map(o => ({ text: o.text, color: COL[o.k] || COL.out })));
    return {
      fig: spec.fig || 'TRACE', title: spec.title || '',
      stepLabel: (step + 1 + '').padStart(2, '0') + '_' + (spec.steps.length + '').padStart(2, '0'),
      lines, vars, hasVars: vars.length > 0, noVars: vars.length === 0, io,
      note: cur ? cur.note : (spec.intro || 'Press Play to run the program step by step, watching variables and the terminal.'),
      playLabel: this.state.playing ? 'Pause' : 'Play',
      play: this.play, next: this.next, prev: this.prev
    };
  }
}
</script>
</body>
</html>
